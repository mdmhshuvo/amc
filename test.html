<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSC Smart Study Planner</title>

  <style>
    /* Basic page styling */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: 3px solid rgba(0, 123, 255, 0.2);
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .message {
      min-height: 24px;
      margin: 12px 0;
      color: #c62828;
      font-weight: bold;
    }

    .summary {
      margin: 20px 0;
      padding: 15px;
      background: #eef5ff;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f7f7f7;
      border-radius: 8px;
      border-left: 4px solid #007bff;
    }

    .task-info {
      flex: 1;
    }

    .task-subject {
      font-weight: bold;
    }

    .task-time {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .delete-btn {
      width: auto;
      padding: 8px 12px;
      background: #dc3545;
      font-size: 14px;
    }

    .delete-btn:hover {
      background: #a71d2a;
    }

    /* Mobile-friendly styling */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
      }

      h1 {
        font-size: 24px;
      }

      li {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>HSC Smart Study Planner</h1>

    <p class="subtitle">
      আজকের পড়াশোনার পরিকল্পনা তৈরি করুন 📚
    </p>

    <form id="taskForm">
      <div class="form-group">
        <label for="subject">বিষয়ের নাম</label>
        <input
          type="text"
          id="subject"
          name="subject"
          placeholder="যেমন: Physics"
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="minutes">পড়ার সময় (মিনিট)</label>
        <input
          type="number"
          id="minutes"
          name="minutes"
          placeholder="যেমন: 60"
          min="1"
          step="1"
        >
      </div>

      <button type="submit">Add Task</button>

      <p
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></p>
    </form>

    <section class="summary" aria-live="polite">
      মোট পড়ার সময়:
      <span id="totalMinutes">0</span>
      মিনিট
    </section>

    <section>
      <h2>আমার Study Tasks</h2>

      <ul id="taskList">
        <!-- JavaScript এখানে task যোগ করবে -->
      </ul>
    </section>
  </main>

  <script>
    // HTML elements সংগ্রহ করা
    const taskForm = document.getElementById("taskForm");
    const subjectInput = document.getElementById("subject");
    const minutesInput = document.getElementById("minutes");
    const taskList = document.getElementById("taskList");
    const totalMinutes = document.getElementById("totalMinutes");
    const message = document.getElementById("message");

    // মোট মিনিট সংরক্ষণ করার জন্য variable
    let total = 0;

    // Form submit হলে এই function কাজ করবে
    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const subject = subjectInput.value.trim();
      const minutes = Number(minutesInput.value);

      // Validation
      if (subject === "") {
        message.textContent = "দয়া করে একটি বিষয়ের নাম লিখুন।";
        subjectInput.focus();
        return;
      }

      if (minutes <= 0 || !Number.isFinite(minutes)) {
        message.textContent = "পড়ার সময় ০ বা ঋণাত্মক হতে পারবে না।";
        minutesInput.focus();
        return;
      }

      // Error message পরিষ্কার করা
      message.textContent = "";

      // নতুন task তৈরি করা
      const listItem = document.createElement("li");

      const taskInfo = document.createElement("div");
      taskInfo.className = "task-info";

      const subjectElement = document.createElement("div");
      subjectElement.className = "task-subject";
      subjectElement.textContent = subject;

      const timeElement = document.createElement("div");
      timeElement.className = "task-time";
      timeElement.textContent = minutes + " মিনিট";

      taskInfo.appendChild(subjectElement);
      taskInfo.appendChild(timeElement);

      // Delete button
      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "মুছুন";
      deleteButton.setAttribute("aria-label", subject + " task মুছুন");

      // Delete করলে task এবং total থেকে সময় বাদ যাবে
      deleteButton.addEventListener("click", function() {
        total -= minutes;
        totalMinutes.textContent = total;
        listItem.remove();
      });

      listItem.appendChild(taskInfo);
      listItem.appendChild(deleteButton);

      taskList.appendChild(listItem);

      // মোট সময় update
      total += minutes;
      totalMinutes.textContent = total;

      // Input পরিষ্কার করা
      subjectInput.value = "";
      minutesInput.value = "";
      subjectInput.focus();
    });
  </script>

</body>
</html>
